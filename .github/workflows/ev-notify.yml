name: EV dispatch check

on:
  schedule:
    # Every 5 minutes. GitHub Actions cron timing is best-effort, not exact —
    # expect some jitter (a few extra minutes) especially during busy periods.
    - cron: '*/5 * * * *'
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab, useful for testing

permissions:
  contents: write # needed to push the state file to the "state" branch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need branch history to check out/create the "state" branch later

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Fetch previous state from the state branch
        # State lives on a separate "state" branch so these updates never
        # touch main and never trigger a Pages rebuild. If the branch
        # doesn't exist yet (first-ever run), fall back to a fresh idle state.
        run: |
          mkdir -p state
          if git ls-remote --exit-code --heads origin state > /dev/null 2>&1; then
            git fetch origin state
            git show origin/state:state/ev-status.json > state/ev-status.json 2>/dev/null || echo '{"status":"idle"}' > state/ev-status.json
          else
            echo '{"status":"idle"}' > state/ev-status.json
          fi

      - name: Check EV status and notify
        env:
          OCTOPUS_ACCOUNT_NUMBER: ${{ secrets.OCTOPUS_ACCOUNT_NUMBER }}
          KRAKEN_EMAIL: ${{ secrets.KRAKEN_EMAIL }}
          KRAKEN_PASSWORD: ${{ secrets.KRAKEN_PASSWORD }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
        run: node scripts/ev-check.mjs

      - name: Commit updated state to the state branch (not main)
        run: |
          cp state/ev-status.json /tmp/ev-status.json
          git config user.name "kraken-watch-bot"
          git config user.email "actions@github.com"
          rm -rf state
          if git ls-remote --exit-code --heads origin state > /dev/null 2>&1; then
            git checkout -B state origin/state
          else
            git checkout --orphan state
            git reset --hard
          fi
          mkdir -p state
          cp /tmp/ev-status.json state/ev-status.json
          git add state/ev-status.json
          git diff --staged --quiet || git commit -m "Update EV status"
          git push origin state
